{% extends "base.html" %}

{% block title %}Authentification{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow">
            <ul class="nav nav-pills mb-3" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Connexion</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#signup">Inscription</button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="login">
                    <form method="POST" action="{{ url_for('main.login') }}">
                        <input name="username" class="form-control mb-3" placeholder="Username" required>
                        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                        <button class="btn btn-primary w-100">Connexion</button>
                    </form>
                </div>
                <div class="tab-pane fade" id="signup">
                    <form method="POST" action="{{ url_for('main.signup') }}">
                        <input name="username" class="form-control mb-3" placeholder="Username" required>
                        <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                        <button class="btn btn-dark w-100">Créer un compte</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
